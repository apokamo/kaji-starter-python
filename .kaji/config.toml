# kaji configuration.
# 設定仕様の正本: https://github.com/apokamo/kaji/blob/main/docs/reference/configuration.md
# 各 key の解説: docs/reference/configuration.md

[paths]
artifacts_dir = ".kaji/artifacts"
skill_dir = ".claude/skills"

[execution]
default_timeout = 2400
agent_runner = "headless"           # "headless"（既定） | "interactive_terminal"（既定 backend の tmux は 3.1+ 必須）
# interactive_terminal_backend = "tmux"  # "tmux"（既定） | "herdr"（Herdr 0.8.2+ の pane 内で実行。interactive_terminal のときのみ作用）
# failure_triage = true             # 失敗分類・証跡コメント・incident 集約（既定 true）
# auto_recover = false              # recovery chain ごと1回の自動再開を許可（強い副作用のため opt-in）

# incident ラベルは scripts/setup_labels.sh が作る旧名（`incident` / `incident:*`）を使う。
# kaji v0.21.0 以降の既定名は `kaji:incident` 系のため、旧名を明示して setup_labels.sh と揃える。
[incident]
kind_label = "incident"
initial_status_label = "incident:investigating"
transient_label = "incident:cause:transient"

# Repository default. local provider は kaji v0.21.0 で deprecated（警告のみ・当面利用可）。試す場合は `uv run kaji local init` で
# .kaji/config.local.toml (gitignored) overlay を作って切り替える。
[provider]
type = "github"

[provider.github]
repo = "<owner>/<repo>"             # ← 自分の repository に書き換える（必須）
default_branch = "main"
git_remote = "origin"
